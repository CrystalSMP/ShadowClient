# Baut bei jedem Tag (z. B. v0.7.0) automatisch: ShadowClient-Mod → Launcher → Windows-Installer
# und veröffentlicht alles als GitHub-Release. Die Webseite verlinkt immer auf das neueste Release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (z. B. 0.7.0)"
        required: true
      notes:
        description: "Was ist neu? (wird im Launcher angezeigt)"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version bestimmen
        id: v
        shell: bash
        run: |
          V="${{ github.event.inputs.version }}"
          [ -z "$V" ] && V="${GITHUB_REF_NAME#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Baue Version $V"

      # ---------- 1. Mod ----------
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: ShadowClient-Mod bauen
        working-directory: minecraft-mod
        shell: bash
        run: ./gradlew build --no-daemon
      - name: Mod in den Launcher legen
        shell: bash
        run: |
          JAR=$(ls minecraft-mod/build/libs/shadowclient-*.jar | grep -v -e sources -e dev | head -1)
          echo "Mod: $JAR"
          mkdir -p launcher/src-tauri/resources/mods
          cp "$JAR" launcher/src-tauri/resources/mods/shadowclient.jar
          cp "$JAR" "shadowclient-mod-${{ steps.v.outputs.version }}.jar"

      # ---------- 2. Launcher ----------
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri
      - name: Versionsnummer eintragen
        shell: bash
        working-directory: launcher
        run: |
          V="${{ steps.v.outputs.version }}"
          node -e "for (const f of ['package.json','src-tauri/tauri.conf.json']) { const fs=require('fs'); const j=JSON.parse(fs.readFileSync(f)); j.version='$V'; fs.writeFileSync(f, JSON.stringify(j,null,2)); }"
          sed -i "0,/^version = .*/s//version = \"$V\"/" src-tauri/Cargo.toml
      - name: Abhängigkeiten
        working-directory: launcher
        run: npm ci
      - name: Update-Adresse eintragen
        shell: bash
        run: sed -i "s#__REPO__#${{ github.repository }}#g" launcher/src-tauri/tauri.conf.json
      - name: Installer bauen (signiert für Auto-Updates)
        working-directory: launcher
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --config src-tauri/tauri.release.json

      # ---------- 3. Veröffentlichen ----------
      - name: Dateien einsammeln
        shell: bash
        env:
          NOTES: ${{ github.event.inputs.notes }}
        run: |
          mkdir dist
          EXE=$(ls launcher/src-tauri/target/release/bundle/nsis/*.exe | head -1)
          cp "$EXE" "dist/ShadowClient-Setup.exe"                       # fester Name für die Webseite
          cp "$EXE" "dist/ShadowClient-Setup-${{ steps.v.outputs.version }}.exe"
          cp shadowclient-mod-*.jar dist/
          # latest.json: daraus erfahren installierte Launcher, dass es ein Update gibt
          V="${{ steps.v.outputs.version }}"
          SIG=$(cat "$EXE.sig")
          URL="https://github.com/${{ github.repository }}/releases/download/v$V/ShadowClient-Setup-$V.exe"
          node -e "require('fs').writeFileSync('dist/latest.json', JSON.stringify({ version: '$V', notes: process.env.NOTES || 'Neue Version von ShadowClient', pub_date: new Date().toISOString(), platforms: { 'windows-x86_64': { signature: process.argv[1], url: process.argv[2] } } }, null, 2))" "$SIG" "$URL"
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: ShadowClient ${{ steps.v.outputs.version }}
          generate_release_notes: true
          files: dist/*
