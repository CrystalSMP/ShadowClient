[package]
name = "shadowclient-launcher"
version = "0.6.0"
description = "ShadowClient Launcher"
edition = "2021"
rust-version = "1.77"

[lib]
name = "shadowclient_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
futures = "0.3"
sha1 = "0.10"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "process", "io-util", "sync", "time", "macros"] }
log = "0.4"
thiserror = "2"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
discord-rich-presence = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"
flate2 = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
